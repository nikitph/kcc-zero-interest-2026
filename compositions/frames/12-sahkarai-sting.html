  <script>
    (function () {
      var ID = "12-sahkarai-sting";
      var tl = gsap.timeline({ paused: true });

      // ---- ribbon draw + head riders (one driver per ribbon, seek-safe) ----
      var ribA = document.getElementById("st12-ribbon-a");
      var ribB = document.getElementById("st12-ribbon-b");
      var riderEm = document.getElementById("st12-rider-em");
      var riderSky = document.getElementById("st12-rider-sky");
      var lenA = ribA.getTotalLength();
      var lenB = ribB.getTotalLength();
      ribA.setAttribute("stroke-dasharray", lenA + " " + (lenA + 200));
      ribB.setAttribute("stroke-dasharray", lenB + " " + (lenB + 200));

      // u: 0→1 rides the ribbon tip (ribbon draws in step), 1→2 hops from the ribbon end to the rest spot
      function place(path, len, rider, u, restX, restY) {
        var d = Math.min(u, 1) * len;
        path.setAttribute("stroke-dashoffset", String(len - d));
        var x, y;
        if (u <= 1) {
          var p = path.getPointAtLength(d);
          x = p.x; y = p.y;
        } else {
          var k = Math.min(u - 1, 1);
          var e = path.getPointAtLength(len);
          x = e.x + (restX - e.x) * k;
          y = e.y + (restY - e.y) * k - 70 * Math.sin(Math.PI * k);
        }
        rider.setAttribute("transform", "translate(" + x.toFixed(2) + " " + y.toFixed(2) + ")");
      }
      var drvA = { u: 0 }, drvB = { u: 0 };
      function updA() { place(ribA, lenA, riderEm, drvA.u, 520, 132); }
      function updB() { place(ribB, lenB, riderSky, drvB.u, 280, 132); }
      updA(); updB();

      // Scene 1 — @0.30 "सहकार": both ribbons draw from their outer ends through the crossover
      tl.to(drvB, { u: 1, duration: 1.52, ease: "power2.inOut", onUpdate: updB }, 0.20);
      tl.to(drvA, { u: 1, duration: 1.52, ease: "power2.inOut", onUpdate: updA }, 0.24);
      // heads pop onto the riding tips — sky @0.98, emerald @1.19 ("ए आई")
      tl.fromTo("#st12-pop-sky", { scale: 0, opacity: 0, svgOrigin: "0 0" }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.2)" }, 0.88);
      tl.fromTo("#st12-pop-em",  { scale: 0, opacity: 0, svgOrigin: "0 0" }, { scale: 1, opacity: 1, duration: 0.42, ease: "back.out(2.2)" }, 1.09);
      // after crossing, each head hops off its ribbon end to its rest spot
      tl.to(drvB, { u: 2, duration: 0.34, ease: "power2.out", onUpdate: updB }, 1.72);
      tl.to(drvA, { u: 2, duration: 0.34, ease: "power2.out", onUpdate: updA }, 1.76);
      // landing squash
      tl.to("#st12-pop-sky", { scaleX: 1.14, scaleY: 0.86, duration: 0.08, ease: "power1.out" }, 2.06);
      tl.to("#st12-pop-sky", { scaleX: 1, scaleY: 1, duration: 0.22, ease: "back.out(2)" }, 2.14);
      tl.to("#st12-pop-em",  { scaleX: 1.14, scaleY: 0.86, duration: 0.08, ease: "power1.out" }, 2.10);
      tl.to("#st12-pop-em",  { scaleX: 1, scaleY: 1, duration: 0.22, ease: "back.out(2)" }, 2.18);

      // background double-circle swell under the build
      tl.fromTo("#st12-swell-out", { scale: 0.86, opacity: 0 }, { scale: 1, opacity: 0.55, duration: 2.4, ease: "power3.out" }, 0);
      tl.fromTo("#st12-swell-in",  { scale: 0.8,  opacity: 0 }, { scale: 1, opacity: 0.9,  duration: 2.2, ease: "power3.out" }, 0.1);

      // Scene 2 — wordmark rises under the mark, then tagline per word
      tl.fromTo("#st12-wordmark", { y: 26, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, 1.86);
      var words = document.querySelectorAll("#st12-tagline .st12-w");
      var cues = [2.05, 2.72, 3.10, 3.48];
      for (var i = 0; i < words.length; i++) {
        tl.fromTo(words[i], { y: 34, opacity: 0 }, { y: 0, opacity: 1, duration: 0.55, ease: "power3.out" }, cues[i] - 0.12);
      }

      // Scene 3 — hairline + source line; still to the end
      tl.fromTo("#st12-hair", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.6, ease: "power3.out" }, 3.90);
      tl.fromTo("#st12-source", { y: 14, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power2.out" }, 4.00);

      // final frame: last 0.5s fade the whole frame to paper
      tl.to(["#st12-content", "#st12-swells"], { opacity: 0, duration: 0.5, ease: "power1.inOut" }, 6.45);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
