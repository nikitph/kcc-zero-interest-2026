  <script>
    (function () {
      var NS = "http://www.w3.org/2000/svg";
      var svg = document.getElementById("min-land-dots");

      // ---- deterministic halftone furrows (perspective rows converging to a horizon above the plot) ----
      var W = 560, H = 560, PITCH = 16;
      var VX = 280, VY = -260;           // vanishing point above the plot
      var BANDS = 7;
      var bands = [];
      for (var b = 0; b < BANDS; b++) {
        var g = document.createElementNS(NS, "g");
        g.setAttribute("class", "min-land-band");
        svg.appendChild(g);
        bands.push(g);
      }
      // colour ramp teal (far) -> emerald (near)
      var stops = [[13, 148, 136], [16, 185, 129], [52, 211, 153]];
      function lerpColor(t) {
        t = Math.max(0, Math.min(1, t));
        var seg = t < 0.5 ? 0 : 1, lt = t < 0.5 ? t / 0.5 : (t - 0.5) / 0.5;
        var a = stops[seg], c = stops[seg + 1];
        return "rgb(" + Math.round(a[0] + (c[0] - a[0]) * lt) + "," + Math.round(a[1] + (c[1] - a[1]) * lt) + "," + Math.round(a[2] + (c[2] - a[2]) * lt) + ")";
      }
      var OX = 280, OY = 560, MAXD = Math.sqrt(280 * 280 + 560 * 560);
      var row = 0;
      for (var y = PITCH / 2; y < H; y += PITCH, row++) {
        var off = (row % 2) ? PITCH / 2 : 0;
        for (var x = PITCH / 2 + off - PITCH / 2; x < W + PITCH / 2; x += PITCH) {
          var depth = y / H;                               // 0 far (top) -> 1 near (bottom)
          var ang = Math.atan2(x - VX, y - VY);
          var furrow = Math.pow(Math.cos(ang * 22), 2);
          var r = (PITCH * 0.46) * (0.3 + 0.7 * depth) * (0.28 + 0.72 * furrow);
          if (r < 0.9) continue;
          var c = document.createElementNS(NS, "circle");
          c.setAttribute("cx", x.toFixed(1));
          c.setAttribute("cy", y.toFixed(1));
          c.setAttribute("r", r.toFixed(2));
          c.setAttribute("fill", lerpColor(depth * 0.85 + furrow * 0.15));
          var d = Math.sqrt((x - OX) * (x - OX) + (y - OY) * (y - OY)) / MAXD;
          bands[Math.min(BANDS - 1, Math.floor(d * BANDS))].appendChild(c);
        }
      }

      var tl = gsap.timeline({ paused: true });

      // Chrome (0–0.4s)
      tl.fromTo("#min-land-chrome", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0);

      // Scene 1 — @0.30 "ध्यान रहे": sky-outlined attention pill pops
      tl.fromTo("#min-land-pill", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.55, ease: "back.out(1.4)" }, 0.18);
      tl.to("#min-land-info-ring", { strokeDashoffset: 0, duration: 0.6, ease: "power2.out" }, 0.26);

      // @1.58 "नए केसीसी के लिए": headline rises
      tl.fromTo("#min-land-headline", { opacity: 0, y: 44 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 1.46);

      // Scene 2 — @2.70 "कम से कम": plot blooms from the near edge outward
      tl.fromTo("#min-land-plot", { opacity: 0, scale: 0.9, y: 30 }, { opacity: 1, scale: 1, y: 0, duration: 0.8, ease: "expo.out" }, 2.58);
      tl.fromTo(".min-land-band", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out", stagger: 0.09 }, 2.62);
      // dimension brackets draw on two sides
      tl.to("#min-land-br-left", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 2.95);
      tl.to("#min-land-br-bottom", { strokeDashoffset: 0, duration: 0.7, ease: "power2.inOut" }, 3.2);

      // @3.63 "शून्य दशमलव एक": 0.10 counts in, landing @4.75
      tl.fromTo("#min-land-value", { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(1.4)" }, 3.5);
      var num = document.getElementById("min-land-num");
      var state = { v: 0 };
      tl.fromTo(state, { v: 0 }, {
        v: 0.10, duration: 1.25, ease: "power3.out",
        onUpdate: function () { num.textContent = state.v.toFixed(2); }
      }, 3.5);
      tl.fromTo(num, { scale: 0.62 }, { scale: 1, duration: 1.25, ease: "power3.out" }, 3.5);

      // @5.03 "हेक्टेयर": unit label
      tl.fromTo("#min-land-unit", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 4.9);

      // @6.14 "ज़रूरी": minimum-land line under the plot
      tl.fromTo("#min-land-line", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, 6.02);

      // Hold: barely-perceptible slow push on the plot (camera micro-drift)
      tl.fromTo("#min-land-plot-stage", { scale: 1 }, { scale: 1.02, duration: 7.59 - 4.75, ease: "none" }, 4.75);

      window.__timelines = window.__timelines || {};
      window.__timelines["10-min-land"] = tl;
    })();
