      for (var m = 0; m < 12; m++) {

        var tDepth = (y - y0) / (y1 - y0);
        var off = (row % 2) * (pitch / 2);
        var col = "rgb(" + Math.round(c0[0] + (c1[0] - c0[0]) * tDepth) + "," + Math.round(c0[1] + (c1[1] - c0[1]) * tDepth) + "," + Math.round(c0[2] + (c1[2] - c0[2]) * tDepth) + ")";

          c.setAttribute("r", r.toFixed(2));
          c.setAttribute("fill", col);

      tl.fromTo("#f03-seg-rabi", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 2.28);
      tl.fromTo("#f03-chip-rabi", { opacity: 0, y: 16, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 2.30);

      // Scene 3 (4.0–6.6): gap closes @4.35 — segments slide together and fuse into one ramp bar
      tl.to("#f03-seg-kharif", { scaleX: 380 / 350, duration: 0.45, ease: "power3.inOut" }, 4.22);
      tl.fromTo("#f03-seg-rabi", { scaleX: 1, transformOrigin: "100% 50%" }, { scaleX: 380 / 350, duration: 0.45, ease: "power3.inOut", immediateRender: false }, 4.22);
      tl.to(["#f03-chip-kharif", "#f03-chip-rabi"], { opacity: 0, y: -10, duration: 0.35, ease: "power2.in" }, 4.3);
      tl.fromTo("#f03-seam", { opacity: 0, scaleY: 0.6 }, { opacity: 1, scaleY: 1.1, duration: 0.2, ease: "power2.out" }, 4.55);
      tl.to("#f03-seam", { opacity: 0, scaleY: 1.3, duration: 0.45, ease: "power2.out" }, 4.75);

      // headline @5.32
