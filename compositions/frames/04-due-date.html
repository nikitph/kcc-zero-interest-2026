  <script>
    (function () {
      const ID = "04-due-date";
      const SVGNS = "http://www.w3.org/2000/svg";
      const root = document.querySelector('[data-composition-id="04-due-date"]');
      const q = (sel) => root.querySelector(sel);

      /* ---------- halftone: radial emerald swell from bottom-left (deterministic) ---------- */
      const ht = q("#dd04-halftone");
      const OX = -60, OY = 1990, PITCH = 18, REACH = 980;
      const bands = [[], [], [], []];
      const bandGroups = [];
      for (let b = 0; b < 4; b++) {
        const g = document.createElementNS(SVGNS, "g");
        ht.appendChild(g);
        bandGroups.push(g);
      }
      const lerp = (a, b, t) => a + (b - a) * t;
      const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
      const mix = (c1, c2, t) => { const a = hex(c1), b = hex(c2); return "rgb(" + [0, 1, 2].map((i) => Math.round(lerp(a[i], b[i], t))).join(",") + ")"; };
      for (let row = 0, y = 1100; y <= 1920; y += PITCH * 0.866, row++) {
        const off = row % 2 ? PITCH / 2 : 0;
        for (let x = off; x <= 1080; x += PITCH) {
          const d = Math.hypot(x - OX, y - OY);
          if (d > REACH) continue;
          const f = Math.exp(-d / 330);
          const r = 7.2 * Math.pow(f, 0.55);
          if (r < 0.7) continue;
          const c = document.createElementNS(SVGNS, "circle");
          c.setAttribute("cx", x.toFixed(1));
          c.setAttribute("cy", y.toFixed(1));
          c.setAttribute("r", r.toFixed(2));
          c.setAttribute("fill", mix("#059669", "#0d9488", Math.min(1, d / REACH)));
          const b = Math.min(3, Math.floor((d / REACH) * 4));
          bandGroups[b].appendChild(c);
        }
      }

      /* ---------- dial: 12 month segments ---------- */
      const CX = 400, CY = 400, R = 270, SW = 46, GAP = 2.2;
      const pt = (deg, rad) => { const a = (deg - 90) * Math.PI / 180; return [CX + rad * Math.cos(a), CY + rad * Math.sin(a)]; };
      const arc = (a0, a1) => { const p0 = pt(a0, R), p1 = pt(a1, R); return "M" + p0[0].toFixed(2) + " " + p0[1].toFixed(2) + " A" + R + " " + R + " 0 0 1 " + p1[0].toFixed(2) + " " + p1[1].toFixed(2); };
      const stops = [[0, "#0284c7"], [0.25, "#0ea5e9"], [0.45, "#0d9488"], [0.65, "#10b981"], [1, "#059669"]];
      const ramp = (t) => { for (let i = 0; i < stops.length - 1; i++) { const [t0, c0] = stops[i], [t1, c1] = stops[i + 1]; if (t <= t1) return mix(c0, c1, (t - t0) / (t1 - t0)); } return stops[stops.length - 1][1]; };
      const track = q("#dd04-track"), fill = q("#dd04-fill"), labels = q("#dd04-labels");
      const trackSegs = [], fillSegs = [], labelEls = [];
      for (let i = 0; i < 12; i++) {
        const a0 = i * 30 + GAP, a1 = (i + 1) * 30 - GAP;
        const t = document.createElementNS(SVGNS, "path");
        t.setAttribute("d", arc(a0, a1));
        t.setAttribute("fill", "none");
        t.setAttribute("stroke", "#dfe6ee");
        t.setAttribute("stroke-width", SW);
        t.setAttribute("pathLength", "100");
        t.setAttribute("stroke-dasharray", "100 100");
        t.setAttribute("stroke-dashoffset", "100");
        track.appendChild(t); trackSegs.push(t);
        const f = document.createElementNS(SVGNS, "path");
        f.setAttribute("d", arc(a0, a1));
        f.setAttribute("fill", "none");
        f.setAttribute("stroke", ramp(i / 11));
        f.setAttribute("stroke-width", SW);
        f.setAttribute("pathLength", "100");
        f.setAttribute("stroke-dasharray", "100 100");
        f.setAttribute("stroke-dashoffset", "100");
        fill.appendChild(f); fillSegs.push(f);
        const lp = pt((i + 0.5) * 30, R + SW / 2 + 42);
        const l = document.createElementNS(SVGNS, "text");
        l.setAttribute("x", lp[0].toFixed(1));
        l.setAttribute("y", lp[1].toFixed(1));
        l.setAttribute("text-anchor", "middle");
        l.setAttribute("dominant-baseline", "central");
        l.setAttribute("class", "dd04-mlabel");
        l.textContent = String(i + 1);
        labels.appendChild(l); labelEls.push(l);
      }

      /* ---------- timeline ---------- */
      const tl = gsap.timeline({ paused: true });
      const num = q("#dd04-num");

      // chrome 0–0.4s
      tl.fromTo(q("#dd04-brand"), { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0);
      tl.fromTo(q("#dd04-chip"), { opacity: 0, x: 16 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 0.04);

      // background halftone bloom from the corner outward
      bandGroups.forEach((g, b) => {
        tl.fromTo(g, { opacity: 0 }, { opacity: 1, duration: 0.9, ease: "power2.out" }, 0.05 + b * 0.22);
      });

      // slow continuous camera push on the dial
      tl.fromTo(q("#dd04-cam"), { scale: 0.975 }, { scale: 1.02, duration: 6.56, ease: "none" }, 0);

      // Scene 1 — @0.30 question headline rises
      tl.fromTo(q("#dd04-headline"), { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.18);

      // Scene 2 — @1.92 ring (faint segments) draws in clockwise
      tl.fromTo(q("#dd04-disc"), { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 0.7, ease: "power3.out" }, 1.8);
      trackSegs.forEach((s, i) => {
        tl.fromTo(s, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.22, ease: "power2.out" }, 1.8 + i * 0.05);
      });
      tl.fromTo(labelEls, { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power2.out", stagger: 0.05 }, 1.9);

      // @2.92 pin drops at 12 o'clock with "पहली निकासी" pill
      tl.fromTo(q("#dd04-stem"), { opacity: 0, scaleY: 0, transformOrigin: "50% 100%" }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power3.out" }, 2.8);
      tl.fromTo(q("#dd04-pinhead"), { opacity: 0, y: -70 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.4)" }, 2.8);
      tl.fromTo(q("#dd04-pill"), { opacity: 0, y: -24, scale: 0.9 }, { opacity: 1, y: 0, scale: 1, duration: 0.5, ease: "back.out(1.4)" }, 2.86);

      // @3.69 pin pulses once
      tl.fromTo(q("#dd04-pulse"), { opacity: 0.7, scale: 0.7 }, { opacity: 0, scale: 2.4, duration: 0.8, ease: "power2.out", immediateRender: false }, 3.58);
      tl.fromTo(q("#dd04-pinhead"), { scale: 1 }, { scale: 1.25, duration: 0.16, ease: "power2.out" }, 3.58);
      tl.to(q("#dd04-pinhead"), { scale: 1, duration: 0.4, ease: "power3.out" }, 3.74);

      // Scene 3 — @4.59 segments fill clockwise + numeral counts 0→12, landing on @4.96
      const FILL_AT = 4.48, LAND = 4.96, SEG_D = 0.1;
      const step = (LAND - FILL_AT - SEG_D) / 11;
      fillSegs.forEach((s, i) => {
        tl.fromTo(s, { attr: { "stroke-dashoffset": 100 } }, { attr: { "stroke-dashoffset": 0 }, duration: SEG_D, ease: "none" }, FILL_AT + i * step);
      });
      labelEls.forEach((l, i) => {
        tl.fromTo(l, { fill: "#94a3b8" }, { fill: "#0f172a", duration: SEG_D, ease: "none" }, FILL_AT + i * step);
      });
      const state = { v: 0 };
      tl.fromTo(num, { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "none" }, FILL_AT);
      tl.fromTo(state, { v: 0 }, {
        v: 12, duration: LAND - FILL_AT, ease: "none",
        onUpdate: () => { num.textContent = String(Math.round(state.v)); }
      }, FILL_AT);
      tl.fromTo(num, { scale: 0.55 }, { scale: 1, duration: LAND - FILL_AT, ease: "power2.out" }, FILL_AT);
      tl.fromTo(q("#dd04-glow"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, LAND - 0.1);

      // @5.36 "माह" label under the numeral, then hold
      tl.fromTo(q("#dd04-unit"), { opacity: 0, y: 28 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 5.24);

      // pad timeline to the full frame duration
      tl.set({}, {}, 6.56);

      window.__timelines = window.__timelines || {};
      window.__timelines[ID] = tl;
    })();
  </script>
